<!DOCTYPE html><html lang="zh"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>妖牌闯关 · 真实进程模拟</title>
<!-- Pyodide 运行时（如需换版本，改这里 + 下面 PYODIDE_INDEX 保持一致） -->
<script src="https://cdn.jsdelivr.net/pyodide/v0.26.2/full/pyodide.js"></script>
<style>
:root{
  --bg:#000; --bg-elev:#0b0b0d;
  --card:#1c1c1e; --card2:#2c2c2e; --card3:#363639;
  --sep:#38383a;
  --label:#fff; --sec:#8e8e93; --sec2:#aeaeb2;
  --blue:#0a84ff; --blue-soft:rgba(10,132,255,.16);
  --green:#30d158; --green-soft:rgba(48,209,88,.16);
  --red:#ff453a; --orange:#ff9f0a; --yellow:#ffd60a; --purple:#5e5ce6; --cyan:#64d2ff;
  --radius:14px;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;}
body{
  background:var(--bg); color:var(--label);
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  font-size:15px; line-height:1.45;
  max-width:560px; margin:0 auto;
  padding:0 12px;
  padding-bottom:calc(24px + env(safe-area-inset-bottom));
  -webkit-font-smoothing:antialiased;
}
.sub{color:var(--sec); font-size:12px;}

/* 顶部导航（毛玻璃吸顶）*/
.nav{position:sticky; top:0; z-index:20; margin:0 -12px; padding:10px 16px;
  background:rgba(0,0,0,.72);
  -webkit-backdrop-filter:saturate(180%) blur(20px); backdrop-filter:saturate(180%) blur(20px);
  border-bottom:1px solid rgba(255,255,255,.06);
  display:flex; align-items:baseline; gap:10px;}
.nav .title{font-size:17px; font-weight:600; letter-spacing:-.2px;}
.nav .hud{color:var(--sec); font-size:13px; margin-left:auto;}

/* 工具栏 */
.toolbar{display:flex; flex-wrap:wrap; gap:8px; align-items:center; margin:12px 0;}
.btn{appearance:none; border:0; border-radius:10px; padding:8px 14px; font-size:14px; font-weight:500;
  background:var(--card2); color:var(--label); cursor:pointer; min-height:38px; transition:filter .15s,transform .05s;}
.btn:active{filter:brightness(1.25); transform:scale(.97);}
.btn.tinted{background:var(--blue-soft); color:var(--blue);}
.btn.danger{background:rgba(255,69,58,.16); color:var(--red);}
.btn.small{padding:6px 10px; font-size:13px;}
.btn.icon{padding:0; width:38px; height:38px; display:inline-flex; align-items:center; justify-content:center;}
.btn.icon svg{width:19px; height:19px; display:block;}
.spacer{flex:1;}

/* iOS toggle */
.switch{position:relative; display:inline-block; width:47px; height:28px; flex:none;}
.switch input{opacity:0; width:0; height:0;}
.slider{position:absolute; inset:0; background:var(--card3); border-radius:28px; transition:.2s;}
.slider:before{content:""; position:absolute; width:24px; height:24px; left:2px; top:2px; background:#fff; border-radius:50%; transition:.2s;}
.switch input:checked + .slider{background:var(--green);}
.switch input:checked + .slider:before{transform:translateX(19px);}

/* 卡片 */
.card{background:var(--card); border-radius:var(--radius); padding:12px 14px; margin:10px 0;}
.teams{display:grid; grid-template-columns:1fr 1fr; gap:10px; align-items:start;}
.team .card-head{display:flex; align-items:baseline; gap:6px; flex-wrap:wrap;}
.card-head{color:var(--sec2); font-size:12px; font-weight:600; letter-spacing:.3px; margin-bottom:8px; text-transform:uppercase;}
.tre{color:var(--yellow); font-size:12px; font-weight:500; text-transform:none; letter-spacing:0;}
.chips{display:flex; flex-wrap:wrap; gap:5px;}
.chip{display:inline-flex; align-items:center; gap:4px; padding:3px 9px; border-radius:9px; font-size:14px; font-weight:600; white-space:nowrap; position:relative;}

/* ===== 面板动画（2026-09-01 反馈：血量增减/阵亡/入队不明显，靠战报逐条核对太累）===== */
.chip.appear{animation:chipIn .5s cubic-bezier(.2,.8,.3,1.15);}
@keyframes chipIn{from{transform:scale(.35); opacity:0;} to{transform:scale(1); opacity:1;}}
.chip.dead{animation:chipOut .6s ease-in forwards; pointer-events:none;}
@keyframes chipOut{to{transform:scale(.5) rotate(10deg); opacity:0; filter:grayscale(1);}}
.chip.flashD{animation:flashD .55s;}
@keyframes flashD{0%{box-shadow:0 0 0 3px var(--red); filter:brightness(1.9);} 100%{box-shadow:0 0 0 0 rgba(0,0,0,0);}}
.chip.flashH{animation:flashH .55s;}
@keyframes flashH{0%{box-shadow:0 0 0 3px var(--green); filter:brightness(1.7);} 100%{box-shadow:0 0 0 0 rgba(0,0,0,0);}}
.delta{position:absolute; left:50%; top:-4px; font-size:13px; font-weight:800; pointer-events:none;
  animation:floatUp .95s ease-out forwards; text-shadow:0 1px 2px #000;}
.delta.d{color:var(--red);} .delta.h{color:var(--green);}
@keyframes floatUp{from{opacity:1; transform:translate(-50%,0);} to{opacity:0; transform:translate(-50%,-24px);}}
.tre.pulse{animation:trePulse .8s;}
@keyframes trePulse{0%{text-shadow:0 0 14px var(--yellow), 0 0 4px var(--yellow);} 100%{text-shadow:none;}}
.evlog div.now{background:var(--blue-soft);}
#skipbtn{position:fixed; left:50%; transform:translateX(-50%); bottom:calc(20px + env(safe-area-inset-bottom));
  z-index:40; display:none; appearance:none; border:1px solid rgba(255,255,255,.12); border-radius:22px;
  padding:10px 20px; font-size:14px; font-weight:600; color:var(--label); cursor:pointer;
  background:rgba(44,44,46,.92); -webkit-backdrop-filter:blur(14px); backdrop-filter:blur(14px);
  box-shadow:0 6px 24px rgba(0,0,0,.5);}
#skipbtn:active{filter:brightness(1.3);}

/* 战报（可折叠：折叠时只露最近几行）*/
.log-card .evlog{max-height:200px; overflow:auto; font-size:13px; margin:0 -.2em;}
.log-card.closed .evlog{max-height:3.9em; overflow:hidden;}
.log-head{display:flex; align-items:center; gap:6px; cursor:pointer; -webkit-user-select:none; user-select:none;}
.log-caret{margin-left:auto; color:var(--blue); font-size:12px; font-weight:600;}
.evlog div{padding:2px .2em; border-radius:4px;}
.heal{color:var(--green);} .atk{color:var(--orange);} .ev{color:var(--purple);}
.win{color:var(--green); font-weight:600;}

/* 决策区（突出）*/
.decision{background:linear-gradient(180deg,#232326,#1c1c1e); border:1px solid rgba(255,255,255,.05);}
.dec{font-size:16px; font-weight:600; margin:0 0 10px;}
.dec .sub{display:block; font-weight:400; margin-top:3px;}

/* 决策选项按钮（整行、大触摸目标）*/
.opts{display:flex; flex-direction:column; gap:8px;}
.opt{appearance:none; width:100%; border:1px solid var(--sep); background:var(--card2); color:var(--label);
  border-radius:12px; padding:12px 14px; font-size:16px; text-align:left; cursor:pointer;
  min-height:48px; display:flex; align-items:center; justify-content:space-between; gap:8px; transition:filter .15s,transform .05s,border-color .15s;}
.opt:active{filter:brightness(1.25); transform:scale(.99);}
.opt.ai{border-color:var(--blue);}
.opt.heur{border-color:var(--green);}
.opt.both{border-color:var(--blue);}
.opt-label{flex:1;}
.opt-tags{display:flex; gap:4px; flex:none;}
.tag{font-size:11px; font-weight:700; padding:2px 7px; border-radius:8px; letter-spacing:.2px;}
.tag-ai{background:var(--blue); color:#fff;}
.tag-heur{background:var(--green); color:#042b0a;}
.opt.dying{opacity:.55;}

/* 骰子输入：总点数平铺 + 法宝触发开关 */
.rollrow{display:flex; gap:8px 10px; flex-wrap:wrap; align-items:center; margin:2px 0 10px;}
.seg{display:inline-flex; border:1px solid var(--sep); border-radius:10px; overflow:hidden;}
.seg button{appearance:none; border:0; background:var(--card2); color:var(--sec2); padding:7px 12px;
  font-size:13px; font-weight:600; min-height:38px; cursor:pointer;}
.seg button.on{background:var(--blue-soft); color:var(--blue);}
.sumgrid{display:flex; flex-wrap:wrap; gap:8px; margin:2px 0 4px;}
.sumtile{appearance:none; border:1px solid var(--sep); background:var(--card2); color:var(--label);
  border-radius:12px; min-width:50px; height:48px; font-size:18px; font-weight:600; cursor:pointer;
  transition:filter .15s,transform .05s;}
.sumtile:active{filter:brightness(1.25); transform:scale(.95);}
.sumtile:disabled{opacity:.25;}

/* 候选输入（平铺点选，无下拉框）*/
.slot{background:var(--card2); border-radius:10px; padding:8px 10px; margin-bottom:8px;}
.slot .chips{display:flex; flex-wrap:wrap; gap:5px; margin:4px 0 6px;}
.tchip{appearance:none; border:0; padding:6px 11px; border-radius:9px; font-size:14px; font-weight:600;
  min-height:36px; cursor:pointer; transition:opacity .1s;}
.tchip.off{opacity:.32;}
.tchip.neutral{background:var(--card3); color:var(--label);}
.tchip.neutral.on{background:var(--blue); color:#fff;}
.stepper{display:flex; align-items:center; gap:10px;}
.stepbtn{appearance:none; border:1px solid var(--sep); background:var(--card3); color:var(--label);
  width:36px; height:36px; border-radius:9px; font-size:17px; font-weight:600; cursor:pointer;}
.hpval{min-width:20px; text-align:center; font-size:16px; font-weight:600;}

/* 加载遮罩（iOS 风）*/
#overlay{position:fixed; inset:0; background:#000; display:flex; flex-direction:column; align-items:center; justify-content:center; z-index:50; gap:18px; padding:24px;}
#overlay .spin{width:34px; height:34px; border:3px solid rgba(255,255,255,.15); border-top-color:var(--blue); border-radius:50%; animation:sp .8s linear infinite;}
@keyframes sp{to{transform:rotate(360deg)}}
#overlay .msg{color:var(--sec2); font-size:14px; text-align:center; max-width:320px;}
#overlay.err{background:#1a0d0d;}
#overlay-err{display:none; color:var(--red); font-size:12px; max-width:520px; white-space:pre-wrap; background:#160808; border:1px solid #5a2326; border-radius:10px; padding:10px;}
.err #overlay-err{display:block;}
.err .spin{display:none;}
#overlay .btn{margin-top:2px;}

.done-banner{font-size:17px; font-weight:600;}
.lose{color:var(--red);}
@media(max-width:380px){ .teams{grid-template-columns:1fr;} .tchip{padding:5px 8px; font-size:13px;} .sumtile{min-width:44px;} }
</style></head><body>
<div id="overlay">
  <div class="spin" id="ov-spin"></div>
  <div class="msg" id="ov-msg">正在加载运行时…<br>首次约 10-20 秒</div>
  <div id="overlay-err"></div>
  <button class="btn tinted" onclick="location.reload()">重新加载</button>
</div>

<header class="nav">
  <div class="title">妖牌闯关</div>
  <div class="hud" id="hud"></div>
</header>

<div class="toolbar">
  <button class="btn icon tinted" onclick="newgame()" aria-label="新游戏" title="新游戏"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 14"/></svg></button>
  <button class="btn icon" onclick="undo()" aria-label="撤销" title="撤销"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 14 4 9 9 4"/><path d="M20 20v-7a4 4 0 0 0-4-4H4"/></svg></button>
  <button class="btn icon" onclick="redo()" aria-label="恢复" title="恢复"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 14 20 9 15 4"/><path d="M4 20v-7a4 4 0 0 1 4-4h12"/></svg></button>
  <button class="btn icon" onclick="saveprog()" aria-label="导出存档" title="导出存档(JSON)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg></button>
  <button class="btn icon" onclick="loadprog()" aria-label="导入存档" title="导入存档(JSON)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg></button>
  <span class="spacer"></span>
  <div class="seg" id="modeseg" style="display:none">
    <button id="md-manual" onclick="switchMode(false)">手工</button>
    <button id="md-script" onclick="switchMode(true)">剧本</button>
  </div>
  <span class="sub" id="modechip" style="display:none"></span>
  <button class="btn small" id="animbtn" onclick="cycleAnim()">动画·开</button>
  <label class="switch"><input type="checkbox" id="hint" checked><span class="slider"></span></label>
  <span class="sub">建议</span>
</div>

<div class="teams">
  <div class="card team">
    <div class="card-head">我方 <span class="tre" id="mytre"></span></div>
    <div class="chips" id="my"></div>
  </div>
  <div class="card team">
    <div class="card-head">敌方 <span class="tre" id="enotre"></span></div>
    <div class="chips" id="enemy"></div>
  </div>
</div>

<div class="card decision" id="decision"></div>
<button id="skipbtn" onclick="flushAnim()">跳过回放 ⏭</button>

<div class="card log-card" id="logcard">
  <div class="card-head log-head" onclick="toggleLog()">
    <span>战报</span><span class="sub" id="logcount">0 条</span>
    <span class="log-caret" id="logcaret">收起 ▾</span>
  </div>
  <div class="evlog" id="evlog"></div>
</div>

const PYODIDE_INDEX = "https://cdn.jsdelivr.net/pyodide/v0.26.2/full/";

// 妖牌配色（iOS 系统色：灰/绿/红/黄/紫/青）
const TS={"顽石":["#8e8e93","#fff"],"甘露":["#30d158","#042b0a"],"斗战":["#ff453a","#fff"],"招财":["#ffd60a","#3a2e00"],"反震":["#5e5ce6","#fff"],"钻石":["#64d2ff","#003b4d"]};
let S=null, py=null;
let MODE=null, HAS_SCRIPT=false, SCRIPT_META=null;   // MODE=true 剧本（引擎代掷） / false 手工（自录骰面）
const TYPES=["顽石","斗战","反震","钻石","招财","甘露"];
const TRES=["仙趣骰","护心符","雷霆刀","八卦盘","海神印","金蝉铃","天雷鼓","聚灵鼎"];

function setmsg(t){document.getElementById("ov-msg").innerHTML=t;}
function fatal(err){
  document.getElementById("overlay").classList.add("err");
  document.getElementById("overlay-err").textContent=String(err&&err.message||err);
  setmsg("加载失败");
}
function b64ToUint8(b64){const bin=atob(b64);const u8=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u8[i]=bin.charCodeAt(i);return u8;}

async function boot(){
  try{
    setmsg("下载 Pyodide 运行时…<br>（约 11MB）");
    py=await loadPyodide({indexURL:PYODIDE_INDEX});
    setmsg("加载 numpy…");
    await py.loadPackage("numpy");
    setmsg("解压游戏资源…");
    await py.unpackArchive(b64ToUint8(ZIP_B64),"zip");
    setmsg("初始化 AI…");
    await py.runPythonAsync(`
from web_real import (init, new_session, state_json, advance_json,
                      undo_json, redo_json, get_save, load_replay_json,
                      has_script)
init()
`);
    const hs=JSON.parse(py.globals.get("has_script")());
    HAS_SCRIPT=hs.script; SCRIPT_META=hs.meta||null;
    S=JSON.parse(py.globals.get("new_session")());
    MODE=HAS_SCRIPT;      // 打包内有剧本 → 默认剧本模式（引擎代掷·你只做决策）
    document.getElementById("overlay").style.display="none";
    setModeUI();
    setAnimBtn();
    render();
  }catch(e){console.error(e);fatal(e);}
}

// ===== 渲染 =====
// 妖牌排序：同类放一起（顺序同招募输入的 TYPES），同类内按血量升序；全程统一配色
const TORDER={};TYPES.forEach((t,i)=>TORDER[t]=i);
function cmpType(t1,h1,t2,h2){return (TORDER[t1]??9)-(TORDER[t2]??9)||h1-h2;}
function sortCards(cs){return (cs||[]).slice().sort((a,b)=>cmpType(a.type,a.hp,b.type,b.hp));}
function cchip(t,hp,extra){const[bg,fg]=TS[t]||["#8e8e93","#fff"];return `<span class="chip" style="background:${bg};color:${fg}">${t} ${hp}${extra||""}</span>`;}

// ===== 面板渲染：uid 键控差分（快照里每张牌带稳定 uid，血量变化闪烁±N、阵亡淡出、入队弹入）=====
// 动画速度：开 / 快 / 关（localStorage 记忆；关=终态直出，行为同旧版）
const ANIMS=[["开",1],["快",.45],["关",0]];
function lsGet(k){try{return localStorage.getItem(k)}catch(e){return null}}
function lsSet(k,v){try{localStorage.setItem(k,v)}catch(e){}}
let animIdx=Math.min(ANIMS.length-1,Math.max(0,+(lsGet("xddq_anim")||0)||0));
function animSpd(){return ANIMS[animIdx][1];}
function cycleAnim(){animIdx=(animIdx+1)%ANIMS.length;lsSet("xddq_anim",animIdx);setAnimBtn();if(animIdx===0)flushAnim();}
function setAnimBtn(){document.getElementById("animbtn").textContent="动画·"+ANIMS[animIdx][0];}

const PLAY={busy:false,timer:0,i:0};
function boardOf(){   // 终态面板：优先用最后一条快照（带 uid），无 boards 时从 S.my/S.enemy 兜底
  if(S.boards&&S.boards.length)return S.boards[S.boards.length-1];
  return {my:(S.my||[]).map((c,i)=>[c.type,c.hp,"f"+i+c.type]),
          en:(S.enemy||[]).map((c,i)=>[c.type,c.hp,"g"+i+c.type]),
          mt:S.my_tre||[], et:S.enemy_tre||[]};
}
function cmpCard(a,b){return (TORDER[a[0]]??9)-(TORDER[b[0]]??9)||a[1]-b[1]||(a[2]<b[2]?-1:1);}
function makeChip(t,h,u){const[bg,fg]=TS[t]||["#8e8e93","#fff"];const el=document.createElement("span");
  el.className="chip";el.style.background=bg;el.style.color=fg;el.dataset.uid=u;el.dataset.hp=h;
  el.textContent=h+" "+t;return el;}
function renderSide(elId,treId,cards,tre,animate){
  const el=document.getElementById(elId);
  const have=new Map();[...el.children].forEach(ch=>{if(ch.dataset.uid)have.set(ch.dataset.uid,ch);});
  const used=new Set();
  cards.slice().sort(cmpCard).forEach(([t,h,u])=>{
    const key=String(u);let ch=have.get(key);
    if(!ch){ch=makeChip(t,h,key);el.appendChild(ch);
      if(animate){ch.classList.add("appear");setTimeout(()=>ch.classList.remove("appear"),600);}}
    else{
      const prev=+ch.dataset.hp;
      if(h!==prev){
        if(animate){
          const d=document.createElement("span");
          d.className="delta "+(h<prev?"d":"h");d.textContent=(h<prev?"−":"+")+Math.abs(h-prev);
          ch.appendChild(d);setTimeout(()=>d.remove(),1000);
          const cl=h<prev?"flashD":"flashH";ch.classList.remove(cl);void ch.offsetWidth;ch.classList.add(cl);
        }
        ch.dataset.hp=h;
        if(ch.childNodes.length)ch.childNodes[0].nodeValue=h+" "+t;   // 只改文本，别碰 ±N 浮标
        else ch.textContent=h+" "+t;
      }
      el.appendChild(ch);   // 按排序归位
    }
    used.add(key);
  });
  have.forEach((ch,key)=>{if(!used.has(key)&&!ch.classList.contains("dead")){
    if(animate){ch.classList.add("dead");setTimeout(()=>ch.remove(),650);}
    else ch.remove();}});
  const tw=document.getElementById(treId);
  const txt=tre&&tre.length?("法宝 "+tre.join(" ")):"—";
  if(tw.textContent!==txt){tw.textContent=txt;
    if(animate){tw.classList.remove("pulse");void tw.offsetWidth;tw.classList.add("pulse");}}
}
function renderBoard(b,animate){renderSide("my","mytre",b.my,b.mt,animate);renderSide("enemy","enotre",b.en,b.et,animate);}

// ===== 逐行回放：战报一行行放，面板跟着这行的快照动 =====
function delayFor(ev){
  if(ev.includes("(亡)"))return 800;
  if(ev.startsWith("——"))return 620;   // 新关：敌方整队入场
  if(ev.startsWith("—"))return 400;    // 回合分隔
  if(ev.includes("→"))return 500;      // 伤害结算
  if(ev.includes("✚"))return 500;      // 回血
  if(ev.includes("投掷"))return 260;
  return 180;
}
function startPlayback(){
  PLAY.busy=true;PLAY.i=0;
  document.getElementById("skipbtn").style.display="block";
  document.getElementById("decision").innerHTML=
    `<div class="dec" style="color:var(--sec2)">⏳ 战报回放中…<span class="sub">（可点下方"跳过回放"；工具栏可调动画速度）</span></div>`;
  stepPlayback();
}
function stepPlayback(){
  if(!PLAY.busy)return;
  const evs=S.events||[],bds=S.boards||[];
  if(PLAY.i>=evs.length){finishPlayback();return;}
  append_ev(evs[PLAY.i],true);
  if(bds[PLAY.i])renderBoard(bds[PLAY.i],true);
  const shown=evs[PLAY.i];PLAY.i++;
  if(PLAY.i>=evs.length)PLAY.timer=setTimeout(finishPlayback,Math.min(delayFor(shown),420)*animSpd());
  else PLAY.timer=setTimeout(stepPlayback,delayFor(shown)*animSpd());
}
function finishPlayback(){
  if(!PLAY.busy)return;
  PLAY.busy=false;clearTimeout(PLAY.timer);
  document.getElementById("skipbtn").style.display="none";
  renderBoard(boardOf(),false);   // 终态归位（补漏，不动画）
  renderDecision();
}
function flushAnim(){   // 立即结算回放：跳过按钮 / 切到"关" / 工具栏操作前调用（此时 S 仍是旧状态）
  if(!PLAY.busy)return;
  clearTimeout(PLAY.timer);PLAY.busy=false;
  document.getElementById("skipbtn").style.display="none";
  const evs=S.events||[];
  for(let i=PLAY.i;i<evs.length;i++)append_ev(evs[i],false);
  renderBoard(boardOf(),false);
  renderDecision();
}
function tags(i,hint){let t="";if(hint&&i===S.ai)t+=`<span class="tag tag-ai">${S.ai_rule?('AI·'+S.ai_rule):'AI'}</span>`;if(hint&&i===S.heur)t+=`<span class="tag tag-heur">启发</span>`;return t?`<span class="opt-tags">${t}</span>`:"";}
function optClass(i){return `opt ${i===S.ai?'ai':''} ${i===S.heur?'heur':''} ${(i===S.ai&&i===S.heur)?'both':''}`;}

// ===== 骰子总点数平铺 =====
// 没有护心符/海神印时，投掷结果只有"总点数"影响后续 → 直接点总点数即可；
// 有法宝时加"是否触发"开关（护心符=≥2个0点，海神印=≥4同点），其余组合同样不影响流程。
let diceHx=0,diceHs=0,lastRollKey="",curCombos=null,curHasHx=false,curHasHs=false;

function diceCombos(n,d){
  // c0..c3=各面出现次数；斗战(d 颗)只能掷 1-3（面0 不可），其余(a 颗)只能掷 0-2（面3 不可）；面1/面2 皆可
  const a=n-d,m={};
  for(let c3=0;c3<=d;c3++)for(let c0=0;c0<=a;c0++)for(let c2=0;c0+c2+c3<=n;c2++){
    const c1=n-c0-c2-c3;
    const sum=c1+2*c2+3*c3, hx=c0>=2?1:0, hs=Math.max(c0,c1,c2,c3)>=4?1:0;
    const k=sum+"|"+hx+"|"+hs; if(!(k in m))m[k]=[c0,c1,c2,c3];
  }
  return m;
}
function pickCombo(sum){
  // 未持有的法宝不约束触发状态（任取）；已持有的按开关取
  for(const hx of (curHasHx?[diceHx]:[0,1])) for(const hs of (curHasHs?[diceHs]:[0,1])){
    const c=curCombos[sum+"|"+hx+"|"+hs]; if(c)return c;
  }
  return null;
}
function setTog(w,v){if(w==="hx")diceHx=v;else diceHs=v;renderDecision();}
function submit_sum(s){
  const c=pickCombo(s); if(!c)return;
  const dice=[]; for(let v=0;v<4;v++)for(let k=0;k<c[v];k++)dice.push(v);
  post({dice});
}

// ===== 候选输入（平铺点选）=====
let lastInKey="",inState=null;
function setType(i,t){inState[i].t=t;renderDecision();}
function setTre(i,t){inState[i]=t;renderDecision();}
function hpStep(i,dv){inState[i].hp=Math.min(9,Math.max(1,inState[i].hp+dv));renderDecision();}
function typeChips(i){
  return TYPES.map(t=>{const[bg,fg]=TS[t];const on=inState[i].t===t;
    return `<button class="tchip ${on?"":"off"}" style="background:${bg};color:${fg}" onclick="setType(${i},'${t}')">${on?"✓ ":""}${t}</button>`;}).join("");
}
function treChips(i){
  return TRES.map(t=>{const on=inState[i]===t;
    return `<button class="tchip neutral ${on?"on":"off"}" onclick="setTre(${i},'${t}')">${on?"✓ ":""}${t}</button>`;}).join("");
}

function render(){
  const lv=S.level!=null?S.level:'?';
  const rd=S.round!=null?(' · 回合 '+S.round):'';
  document.getElementById("hud").textContent=S.done?`通关 ${S.cleared??'?'}/${S.reached??'?'}`:`第 ${lv} 关${rd}`;
  if(animSpd()>0&&S.events&&S.events.length>1&&S.boards&&S.boards.length>1){
    startPlayback();   // DOM 还是上一状态的面板 → 回放第一条事件起逐行动画
    return;
  }
  renderBoard(boardOf(),animSpd()>0);   // 即时路径（动画关/单事件/系统消息）：终态直出，仍做差分闪烁
  (S.events||[]).forEach(e=>append_ev(e,false));
  renderDecision();
}

function renderDecision(){
  const dec=document.getElementById("decision");
  if(S.done){dec.innerHTML=`<div class="done-banner ${S.cleared>0?'win':'lose'}">本局结束：通关 ${S.cleared} 关（到达第 ${S.reached} 关）</div>`;return;}
  const hint=document.getElementById("hint").checked;
  let h="";

  if(S.stage.endsWith("roll")){
    const n=S.n_dice,d=S.n_douzhan||0,a=n-d;
    const tre=S.stage.startsWith("my")?S.my_tre:S.enemy_tre;
    const key=S.stage+"|"+S.level+"|"+S.round+"|"+n+"|"+d;
    if(key!==lastRollKey){lastRollKey=key;diceHx=0;diceHs=0;curCombos=diceCombos(n,d);curHasHx=tre.includes("护心符");curHasHs=tre.includes("海神印");}
    h=`<div class="dec">${S.roller} 投掷 · 总点数<span class="sub">共 ${n} 颗（斗战 ${d}）${curHasHx||curHasHs?"；先设法宝触发状态，再点总点数":"，点一下即提交"}</span></div>`;
    if(curHasHx||curHasHs){
      h+=`<div class="rollrow">`;
      if(curHasHx)h+=`<span class="sub">护心符</span><div class="seg">
        <button class="${diceHx?"":"on"}" onclick="setTog('hx',0)">未触发</button>
        <button class="${diceHx?"on":""}" onclick="setTog('hx',1)">触发（≥2个0）</button></div>`;
      if(curHasHs)h+=`<span class="sub">海神印</span><div class="seg">
        <button class="${diceHs?"":"on"}" onclick="setTog('hs',0)">未触发</button>
        <button class="${diceHs?"on":""}" onclick="setTog('hs',1)">触发（≥4同点）</button></div>`;
      h+=`</div>`;
    }
    h+=`<div class="sumgrid">`;
    for(let s=d;s<=3*d+2*a;s++){
      h+=`<button class="sumtile" ${pickCombo(s)?"":"disabled"} onclick="submit_sum(${s})">${s}</button>`;
    }
    h+=`</div>`;
  } else if(S.stage==="event_type_input"){
    const labels={herb:"✚ 灵草（全队 +1）",merchant_normal:"商人（普通）",merchant_special:"商人（招财专属）"};
    h=`<div class="dec">${S.prompt}</div><div class="opts">`;
    (S.event_options||[]).forEach((k,i)=>{h+=`<button class="opt" onclick="choose_event('${k}')"><span class="opt-label">${labels[k]||k}</span></button>`;});
    h+=`</div>`;
  } else if(S.stage.endsWith("_input")){
    const key=S.stage+"|"+S.level+"|"+S.round;
    if(key!==lastInKey){lastInKey=key;
      if(S.input==="treasures")inState=TRES.slice(0,S.n);
      else inState=Array.from({length:S.n},()=>({t:TYPES[0],hp:3}));
    }
    h=`<div class="dec">${S.prompt}</div>`;
    for(let i=0;i<S.n;i++){
      if(S.input==="treasures"){
        h+=`<div class="slot"><div class="sub">候选 ${i+1}</div><div class="chips">${treChips(i)}</div></div>`;
      }else{
        h+=`<div class="slot"><div class="sub">候选 ${i+1}</div><div class="chips">${typeChips(i)}</div>
            <div class="stepper"><span class="sub">HP</span>
            <button class="stepbtn" onclick="hpStep(${i},-1)">−</button><span class="hpval">${inState[i].hp}</span>
            <button class="stepbtn" onclick="hpStep(${i},1)">＋</button></div></div>`;
      }
    }
    h+=`<button class="btn tinted" onclick="submit_input()">提交候选</button>`;
  } else {
    h=`<div class="dec">${S.prompt||""}</div><div class="opts">`;
    if(S.stage==="my_reroll_choice"){
      h+=`<div class="sub" style="margin-bottom:8px">当前 ${JSON.stringify(S.dice)} = 和 ${S.sum}${S.expected!=null?"　期望≈"+S.expected:""}</div>`;
      [["保持",0],["重投",1]].forEach(([lab,i])=>{
        h+=`<button class="${optClass(i)}" onclick="choose(${i})"><span class="opt-label">${lab}</span>${tags(i,hint)}</button>`;
      });
    } else if(S.stage==="my_absorb"){
      const dmg=S.damage;
      S.my.map((c,i)=>({c,i})).sort((x,y)=>cmpType(x.c.type,x.c.hp,y.c.type,y.c.hp)).forEach(({c,i})=>{
        const dying=(c.type==="钻石"?Math.min(dmg,1):dmg)>=c.hp;   // 钻石每次受击最多掉 1 点
        h+=`<button class="${optClass(i)} ${dying?'dying':''}" onclick="choose(${i})"><span class="opt-label">${cchip(c.type,c.hp,dying?' ✘':'')}</span>${tags(i,hint)}</button>`;
      });
    } else if(S.stage==="huxinfu_select"||S.stage==="haishenyin_select"||S.stage==="random_dmg_select"){
      (S.cards||[]).map((c,i)=>({c,i})).sort((x,y)=>cmpType(x.c.type,x.c.hp,y.c.type,y.c.hp))
        .forEach(({c,i})=>{h+=`<button class="opt" onclick="choose(${i})"><span class="opt-label">${cchip(c.type,c.hp)}</span></button>`;});
    } else if(S.stage==="merchant_special_swap"){
      (S.options||[]).forEach((o,i)=>{
        h+=`<button class="${optClass(i)}" onclick="choose(${i})"><span class="opt-label">用 ${cchip(o[0],o[1])} 换</span>${tags(i,hint)}</button>`;});
    } else if(S.stage==="merchant_normal_swap"){
      (S.options||[]).map((o,i)=>({o,i})).sort((x,y)=>cmpType(x.o[0],x.o[1],y.o[0],y.o[1]))
        .forEach(({o,i})=>{h+=`<button class="${optClass(i)}" onclick="choose(${i})"><span class="opt-label">换出 ${cchip(o[0],o[1])}</span>${tags(i,hint)}</button>`;});
      h+=`<button class="${optClass(-1)}" onclick="choose(-1)"><span class="opt-label">跳过</span>${tags(-1,hint)}</button>`;
    } else if(S.stage==="treasure_swap"){
      (S.options||[]).forEach((o,i)=>{
        h+=`<button class="${optClass(i)}" onclick="choose(${i})"><span class="opt-label">换出 ${o}</span>${tags(i,hint)}</button>`;});
      h+=`<button class="${optClass(-1)}" onclick="choose(-1)"><span class="opt-label">跳过（不替换）</span>${tags(-1,hint)}</button>`;
    } else if(S.stage==="treasure"){
      (S.options||[]).forEach((o,i)=>{
        h+=`<button class="${optClass(i)}" onclick="choose(${i})"><span class="opt-label">${o}</span>${tags(i,hint)}</button>`;});
      if(S.full)h+=`<button class="${optClass(-1)}" onclick="choose(-1)"><span class="opt-label">跳过（不换法宝）</span>${tags(-1,hint)}</button>`;
    } else if(S.stage==="recruit"&&S.full){
      // 满编同法宝两步（2026-08-24 实测）：先选候选（或取消保持原队）→ 下一步问换出哪张
      (S.options||[]).map((o,i)=>({o,i})).sort((x,y)=>cmpType(x.o[0],x.o[1],y.o[0],y.o[1]))
        .forEach(({o,i})=>{h+=`<button class="${optClass(i)}" onclick="choose(${i})"><span class="opt-label">换入 ${cchip(o[0],o[1])}</span>${tags(i,hint)}</button>`;});
      h+=`<button class="${optClass(-1)}" onclick="choose(-1)"><span class="opt-label">取消（保持原队）</span>${tags(-1,hint)}</button>`;
    } else if(S.stage==="recruit_swap"){
      (S.options||[]).map((o,i)=>({o,i})).sort((x,y)=>cmpType(x.o[0],x.o[1],y.o[0],y.o[1]))
        .forEach(({o,i})=>{h+=`<button class="${optClass(i)}" onclick="choose(${i})"><span class="opt-label">换出 ${cchip(o[0],o[1])}</span>${tags(i,hint)}</button>`;});
      h+=`<button class="${optClass(-1)}" onclick="choose(-1)"><span class="opt-label">不替换（保持原队）</span>${tags(-1,hint)}</button>`;
    } else {
      (S.options||[]).map((o,i)=>({o,i}))
        .sort((x,y)=>(typeof x.o==="string"||typeof y.o==="string")?x.i-y.i:cmpType(x.o[0],x.o[1],y.o[0],y.o[1]))
        .forEach(({o,i})=>{const label=typeof o==="string"?o:cchip(o[0],o[1]);
          h+=`<button class="${optClass(i)}" onclick="choose(${i})"><span class="opt-label">${label}</span>${tags(i,hint)}</button>`;});
    }
    h+=`</div>`;
  }
  dec.innerHTML=h;
}

function append_ev(e,now){if(!e)return;const log=document.getElementById("evlog");
  const prev=log.querySelector("div.now");if(prev)prev.classList.remove("now");
  const d=document.createElement("div");d.textContent=e;
  if(e.includes("✚"))d.className="heal";else if(e.includes("→"))d.className="atk";else if(e.includes("✓"))d.className="win";else if(e.includes("✗"))d.className="lose";else d.className="ev";
  if(now)d.classList.add("now");
  log.appendChild(d);log.scrollTop=log.scrollHeight;
  document.getElementById("logcount").textContent=log.children.length+" 条";}
function toggleLog(){
  const c=document.getElementById("logcard");c.classList.toggle("closed");
  const closed=c.classList.contains("closed");
  document.getElementById("logcaret").textContent=closed?"展开 ▸":"收起 ▾";
  const l=document.getElementById("evlog");l.scrollTop=l.scrollHeight;
}
function clearlog(){document.getElementById("evlog").innerHTML="";document.getElementById("logcount").textContent="0 条";}

// ===== 交互 =====
function submit_input(){
  if(S.input==="treasures")post({options:inState.slice()});
  else if(S.n===1)post({target:[inState[0].t,inState[0].hp]});
  else post({options:inState.map(x=>[x.t,x.hp])});
}
function choose(i){post({choice:i});}
function choose_event(k){post({event:k});}
function post(body){
  flushAnim();   // 回放中若有着手新操作：先把旧状态结算掉（S 被替换前）
  try{S=JSON.parse(py.globals.get("advance_json")(JSON.stringify(body)));}
  catch(e){alert("执行出错："+e.message);console.error(e);return;}
  render();
}
function setModeUI(){
  document.getElementById("modeseg").style.display=HAS_SCRIPT?"inline-flex":"none";
  document.getElementById("md-manual").classList.toggle("on",MODE===false);
  document.getElementById("md-script").classList.toggle("on",MODE===true);
  const chip=document.getElementById("modechip");
  chip.style.display=MODE===null?"none":"inline";
  chip.textContent=MODE?"剧本·引擎代掷·你只做决策":"手工·自录真实骰面";
  if(MODE&&SCRIPT_META&&SCRIPT_META.heur_conf10!=null){
    const f=x=>typeof x==="number"?x.toFixed(1):x;
    chip.title=`heur 校准 ${f(SCRIPT_META.heur_conf10)}@10 关 · AI-g4 ${f(SCRIPT_META.ai_conf10)}@10 关（run_progression 口径）`;
  }
}
function switchMode(m){
  if(!HAS_SCRIPT)m=false;
  if(m===MODE)return;
  if(!confirm((m?"切换到剧本模式":"切换到手工模式")+"将开始新局（当前进度丢弃），确定？"))return;
  newgame(m);
}
function newgame(m){
  if(m===undefined)m=MODE;
  flushAnim();
  try{S=JSON.parse(py.globals.get("new_session")(50, m===true));}
  catch(e){alert("执行出错："+e.message);console.error(e);return;}
  MODE=(m===true);
  setModeUI();
  clearlog();
  render();
}
function undo(){flushAnim();try{S=JSON.parse(py.globals.get("undo_json")());}catch(e){alert(e.message);return;}render();}
function redo(){flushAnim();try{S=JSON.parse(py.globals.get("redo_json")());}catch(e){alert(e.message);return;}render();}
function saveprog(){
  try{
    const save=py.globals.get("get_save")();
    const data=JSON.parse(save);
    const blob=new Blob([save],{type:"application/json"});
    const url=URL.createObjectURL(blob);
    const a=document.createElement("a");
    a.href=url; a.download=`xddq-${MODE?"script":"manual"}-seed${data.seed}-L${data.level||0}-${data.cleared||0}通关.json`;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(()=>URL.revokeObjectURL(url),2000);
  }catch(e){alert("导出失败："+e.message);}
}
function loadprog(){
  const inp=document.createElement("input");
  inp.type="file"; inp.accept=".json,application/json";
  inp.onchange=()=>{
    const f=inp.files[0]; if(!f) return;
    const r=new FileReader();
    r.onload=()=>{
      try{
        flushAnim();
        S=JSON.parse(py.globals.get("load_replay_json")(r.result));
        clearlog();
        render();
      }catch(e){alert("导入失败："+e.message);}
    };
    r.onerror=()=>alert("读取文件失败");
    r.readAsText(f);
  };
  inp.click();
}
boot();
</script></body></html>
